<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Malle 2026 · Kamasutra Profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#E6C15A; --gold-mid:#C9A24B; --gold-dim:#8a7a52;
    --cream:#F5EBD0; --red:#C0392B; --green:#1D9E75; --bg:#050505;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--cream);font-family:'Oswald',sans-serif;}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;padding:24px 18px;overflow-x:hidden;}

  /* ---------- PROFIL ---------- */
  .card{width:100%;max-width:360px;text-align:center;}
  .eyebrow{font-size:12px;letter-spacing:6px;color:var(--red);font-weight:600;margin-bottom:6px;}
  .header{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:1px;color:var(--gold);
          line-height:1.05;text-shadow:0 0 22px rgba(230,193,90,.28);margin-bottom:2px;}

  .divider{display:flex;align-items:center;gap:12px;margin:20px 4px;}
  .divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-mid));}
  .divider .line.r{background:linear-gradient(90deg,var(--gold-mid),transparent);}
  .divider .dot{color:var(--gold-mid);font-size:13px;}

  .name{font-family:'Anton',sans-serif;font-size:clamp(44px,15vw,58px);letter-spacing:3px;
        color:var(--cream);line-height:1;text-shadow:0 2px 24px rgba(245,235,208,.15);}

  .poslabel{margin:28px 0 10px;font-weight:600;font-size:11px;letter-spacing:4px;color:var(--red);}
  .posemoji{font-size:40px;line-height:1;margin-bottom:10px;}
  .position{font-family:'Anton',sans-serif;font-size:clamp(26px,8vw,32px);letter-spacing:.5px;
            color:var(--gold);line-height:1.1;}

  .sparkle{margin:22px 0 6px;color:var(--gold-mid);font-size:14px;letter-spacing:9px;}
  .cta{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:2px;color:var(--cream);margin-bottom:18px;}

  .btn{width:100%;max-width:220px;margin:0 auto;background:linear-gradient(180deg,var(--gold),var(--gold-mid));
       border:2px solid var(--red);border-radius:20px;padding:18px 0;font-size:46px;line-height:1;
       cursor:pointer;box-shadow:0 0 26px rgba(230,193,90,.32);transition:transform .12s ease;}
  .btn:active{transform:scale(.96);}

  .footer{margin-top:24px;font-size:11px;letter-spacing:1px;color:var(--gold-dim);line-height:1.6;}

  /* ---------- ÜBERSICHT ---------- */
  .grid-wrap{width:100%;max-width:640px;text-align:center;}
  .grid-title{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:1px;color:var(--gold);line-height:1.1;}
  .grid-sub{font-size:12px;letter-spacing:3px;color:var(--red);font-weight:600;margin:8px 0 22px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  a.tile{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;
         background:#0d0d0d;border:1px solid #2a2412;border-radius:14px;padding:16px 12px;
         transition:border-color .15s ease,background .15s ease;}
  a.tile:hover{border-color:var(--gold-mid);background:#120f06;}
  .tile .e{font-size:26px;}
  .tile .tn{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:1px;color:var(--cream);}
  .tile .tp{font-size:11px;color:var(--gold);line-height:1.25;}
  .tile .tl{font-size:10px;color:var(--gold-dim);letter-spacing:1px;margin-top:2px;}
  .grid-foot{margin-top:22px;font-size:11px;letter-spacing:1px;color:var(--gold-dim);line-height:1.6;}

  /* ---------- MÜNZWURF ---------- */
  .cf{width:100%;max-width:360px;text-align:center;}
  .cf .match{font-size:13px;letter-spacing:5px;color:var(--green);font-weight:600;margin-bottom:4px;}
  .cf h1{font-family:'Anton',sans-serif;font-size:34px;letter-spacing:1px;color:var(--gold);
         line-height:1.05;text-shadow:0 0 22px rgba(230,193,90,.25);}
  .vsrow{font-family:'Anton',sans-serif;letter-spacing:1px;font-size:17px;margin:14px 0 2px;color:var(--cream);}
  .vsrow .vs{color:var(--red);margin:0 8px;}
  .cf-stage{perspective:1200px;width:250px;height:250px;margin:6px auto;display:flex;align-items:center;justify-content:center;}
  .cf-coin{position:relative;width:210px;height:210px;transform-style:preserve-3d;
           transition:transform 3.4s cubic-bezier(.15,.7,.2,1);}
  .cf-coin.idle{animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-9px) rotateY(12deg)}}
  .cf-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;
           display:flex;flex-direction:column;align-items:center;justify-content:center;
           background:radial-gradient(circle at 38% 32%, #F3D98A 0%, #E6C15A 42%, #B98F35 100%);
           border:8px solid var(--red);
           box-shadow:0 0 40px rgba(230,193,90,.35), inset 0 0 26px rgba(120,80,10,.45);}
  .cf-face.back{transform:rotateY(180deg);}
  .cf-face .em{font-size:50px;line-height:1;filter:drop-shadow(0 2px 3px rgba(80,50,0,.4));}
  .cf-face .nm{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:1px;color:#4a2f06;
               margin-top:6px;max-width:170px;text-align:center;line-height:.95;word-break:break-word;}
  .cf-face .ring{position:absolute;inset:15px;border:2px dashed rgba(120,80,10,.5);border-radius:50%;}
  .cf-result{height:46px;margin-top:12px;opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease;}
  .cf-result.show{opacity:1;transform:none;}
  .cf-result .big{font-family:'Anton',sans-serif;font-size:28px;letter-spacing:1px;color:var(--cream);line-height:1;}
  .cf-result .big b{color:var(--gold);}
  .cf-flip{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:3px;color:#3a2a08;
           background:linear-gradient(180deg,var(--gold),var(--gold-mid));border:2px solid var(--red);
           border-radius:16px;padding:14px 40px;cursor:pointer;box-shadow:0 0 26px rgba(230,193,90,.3);
           transition:transform .12s ease,filter .2s ease;margin-top:14px;}
  .cf-flip:active{transform:scale(.96);}
  .cf-flip:disabled{filter:grayscale(.4) brightness(.8);cursor:default;}
  .cf-back{display:block;margin:16px auto 0;background:none;border:none;color:var(--gold-dim);
           font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;cursor:pointer;}
  .spark{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--gold);pointer-events:none;opacity:0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const PEOPLE = [
  {slug:"jojo",    name:"Johannes", nick:"Jojo",    emoji:"🪀", pos:"Das doppelte Jojo"},
  {slug:"nase",    name:"Stefan",   nick:"Nase",    emoji:"👃", pos:"Der Nasenbär"},
  {slug:"moc",     name:"Marco",    nick:"Moc",     emoji:"🐊", pos:"Das MOCodil"},
  {slug:"pinni",   name:"Sven",     nick:"Pinni",   emoji:"📌", pos:"Die doppelte Pinnadel"},
  {slug:"daumen",  name:"Dominik",  nick:"Daumen",  emoji:"👍", pos:"Der umgedrehte Daumen"},
  {slug:"alberto", name:"Albert",   nick:"Alberto", emoji:"🪑", pos:"Der mallorquinische Klappstuhl"},
  {slug:"alex",    name:"Sascha",   nick:"Alex",    emoji:"🥨", pos:"Der verknotete Alex"},
  {slug:"trex",    name:"Till",     nick:"T-Rex",   emoji:"🦖", pos:"Der einarmige T-Rex"},
  {slug:"christo", name:"Christoph",nick:"Christo", emoji:"🦩", pos:"Der freihändige Flamingo"},
  {slug:"raban",   name:"Julian",   nick:"Raban",   emoji:"🍌", pos:"Der einarmige Bananenbieger"},
];

const app=document.getElementById("app");
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function getPerson(){
  const q=new URLSearchParams(location.search).get("p");
  if(!q) return null;
  const key=q.trim().toLowerCase();
  return PEOPLE.find(p=>p.slug===key || p.name.toLowerCase()===key || p.nick.toLowerCase()===key)
      || PEOPLE[parseInt(key,10)-1] || null;
}

function renderProfile(p){
  app.innerHTML = `
    <div class="card">
      <div class="eyebrow">◆ MALLE 2026 ◆</div>
      <div class="header">🔥 KAMASUTRA<br>PROFIL 🔥</div>
      <div class="divider"><span class="line"></span><span class="dot">♦</span><span class="line r"></span></div>
      <div class="name">${esc(p.nick.toUpperCase())}</div>
      <div class="poslabel">— LIEBLINGSSTELLUNG —</div>
      <div class="posemoji">${p.emoji}</div>
      <div class="position">${esc(p.pos.toUpperCase())}</div>
      <div class="sparkle">✦ ✦ ✦</div>
      <div class="cta">BIST DU DABEI?</div>
      <button class="btn" id="cta">😁</button>
      <div class="footer">Was auf Malle gescannt wird,<br>bleibt auf Malle.</div>
    </div>`;
  document.getElementById("cta").addEventListener("click",()=>renderCoin(p));
}

let cfTurns=0, cfSpinning=false;
function renderCoin(p){
  cfTurns=0; cfSpinning=false;
  const nick=esc(p.nick.toUpperCase());
  app.innerHTML=`
    <div class="cf">
      <div class="match">💚 IT'S A MATCH · MALLE 2026</div>
      <h1>WER GIBT AUS?</h1>
      <div class="vsrow">DU <span class="vs">VS</span> ${nick}</div>
      <div class="cf-stage">
        <div class="cf-coin idle" id="coin">
          <div class="cf-face front"><div class="ring"></div><div class="em">🍺</div><div class="nm">DU</div></div>
          <div class="cf-face back"><div class="ring"></div><div class="em">${p.emoji}</div><div class="nm">${nick}</div></div>
        </div>
      </div>
      <div class="cf-result" id="res"><div class="big" id="resText"></div></div>
      <button class="cf-flip" id="flip">MÜNZE WERFEN</button>
      <button class="cf-back" id="back">‹ ZURÜCK ZUM PROFIL</button>
    </div>`;

  const coin=document.getElementById("coin"), flip=document.getElementById("flip");
  const res=document.getElementById("res"), resText=document.getElementById("resText");

  function sparkle(){
    const r=document.querySelector(".cf-stage").getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    for(let i=0;i<18;i++){
      const s=document.createElement("div"); s.className="spark"; document.body.appendChild(s);
      s.style.left=cx+"px"; s.style.top=cy+"px";
      const a=Math.random()*Math.PI*2, d=90+Math.random()*120;
      s.animate([
        {opacity:1,transform:"translate(-50%,-50%) scale(1)"},
        {opacity:0,transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px)) scale(.3)`}
      ],{duration:700+Math.random()*300,easing:"cubic-bezier(.2,.7,.3,1)"});
      setTimeout(()=>s.remove(),1050);
    }
  }

  flip.addEventListener("click",()=>{
    if(cfSpinning) return;
    cfSpinning=true; flip.disabled=true;
    coin.classList.remove("idle"); res.classList.remove("show");
    const meWins=Math.random()<0.5;              // true => front (DU) oben
    const extra=6+Math.floor(Math.random()*3);
    cfTurns+=extra*360+(meWins?0:180);
    const half=((cfTurns/180)|0)%2;              // 0=front, 1=back
    if((half===0)!==meWins) cfTurns+=180;
    coin.style.transform=`rotateY(${cfTurns}deg)`;
    setTimeout(()=>{
      const w = meWins ? "DU" : nick;
      resText.innerHTML=`<b>${w}</b> GIBT AUS! 🍹`;
      res.classList.add("show"); sparkle();
      flip.textContent="NOCHMAL"; flip.disabled=false; cfSpinning=false;
    },3450);
  });

  document.getElementById("back").addEventListener("click",()=>renderProfile(p));
}

function renderIndex(){
  const tiles=PEOPLE.map(p=>`
    <a class="tile" href="?p=${p.slug}">
      <span class="e">${p.emoji}</span>
      <span class="tn">${esc(p.nick)}</span>
      <span class="tp">${esc(p.pos)}</span>
      <span class="tl">?p=${p.slug}</span>
    </a>`).join("");
  app.innerHTML=`
    <div class="grid-wrap">
      <div class="grid-title">🔥 KAMASUTRA PROFILE 🔥</div>
      <div class="grid-sub">◆ MALLE 2026 · 10 KANDIDATEN ◆</div>
      <div class="grid">${tiles}</div>
      <div class="grid-foot">Jeder QR-Code zeigt auf diese Seite mit dem passenden Kürzel dahinter.<br>
      Tippe eine Kachel an, um das Profil zu sehen.</div>
    </div>`;
}

const person=getPerson();
person ? renderProfile(person) : renderIndex();
</script>
</body>
</html>
